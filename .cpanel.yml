---
# ==============================================================================
# Realty Smartz Pathshala - cPanel Git Auto-Deployment Specification
# Note: Every task in cPanel runs in a fresh subshell, so absolute paths are required.
# ==============================================================================

deployment:
  tasks:
    # 1. Create target directories with absolute paths
    - /bin/mkdir -p /home/realtys1/pathshala_app
    - /bin/mkdir -p /home/realtys1/pathshala_app/app
    - /bin/mkdir -p /home/realtys1/pathshala_app/vendor
    - /bin/mkdir -p /home/realtys1/pathshala_app/database
    - /bin/mkdir -p /home/realtys1/pathshala_app/bin
    - /bin/mkdir -p /home/realtys1/pathshala_app/storage/uploads
    - /bin/mkdir -p /home/realtys1/pathshala_app/storage/logs
    - /bin/mkdir -p /home/realtys1/pathshala_app/storage/backups
    - /bin/mkdir -p /home/realtys1/public_html

    # 2. Force copy application files directly (prevent interactive prompt freeze)
    - /bin/cp -rf app/* /home/realtys1/pathshala_app/app/
    - /bin/cp -rf vendor/* /home/realtys1/pathshala_app/vendor/
    - /bin/cp -rf database/* /home/realtys1/pathshala_app/database/
    - /bin/cp -rf bin/* /home/realtys1/pathshala_app/bin/

    # 3. Force copy public assets and front controller to web root
    - /bin/cp -rf public/* /home/realtys1/public_html/
    - /bin/cp -f public/.htaccess /home/realtys1/public_html/.htaccess

    # 4. Permissions
    - /bin/chmod -R 777 /home/realtys1/pathshala_app/storage
    - /bin/chmod 644 /home/realtys1/public_html/.htaccess
